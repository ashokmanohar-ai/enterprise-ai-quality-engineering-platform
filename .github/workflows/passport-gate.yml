name: AI System Passport Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/ai_quality/passport_engine.py'
      - 'scripts/check_ai_system_passport.py'
      - 'tests/unit/test_passport_engine.py'
      - 'schemas/ai-system-passport.schema.json'
      - 'examples/ai-system-passport.example.json'
      - '.github/workflows/passport-gate.yml'
  pull_request:
    paths:
      - 'src/ai_quality/passport_engine.py'
      - 'scripts/check_ai_system_passport.py'
      - 'tests/unit/test_passport_engine.py'
      - 'schemas/ai-system-passport.schema.json'
      - 'examples/ai-system-passport.example.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passport-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic gate dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Passport unit tests
        run: python -m pytest tests/unit/test_passport_engine.py
      - name: Evaluate reference AI System Passport
        run: python scripts/check_ai_system_passport.py examples/ai-system-passport.example.json
      - name: Write assurance summary
        run: |
          {
            echo '## AI System Passport Gate'
            echo ''
            echo 'The reference passport passed structural checks and deterministic release policy evaluation.'
            echo ''
            echo '**Decision states:** release-ready · conditional · blocked · rolled-back'
          } >> "$GITHUB_STEP_SUMMARY"
