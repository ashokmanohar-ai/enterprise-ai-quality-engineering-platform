name: Release Assurance Visualization

on:
  push:
    branches: [main]
    paths:
      - 'src/ai_quality/release_assurance_visualization.py'
      - 'src/ai_quality/release_trust_graph.py'
      - 'src/ai_quality/incident_regression_loop.py'
      - 'src/ai_quality/incident_revalidation_gate.py'
      - 'src/ai_quality/release_certificate.py'
      - 'src/ai_quality/release_evidence_bundle.py'
      - 'src/ai_quality/trace_release_correlation.py'
      - 'scripts/render_release_assurance_visualization.py'
      - 'tests/unit/test_release_assurance_visualization.py'
      - 'examples/ai-system-passport*.json'
      - 'examples/incident-regression.example.json'
      - 'examples/incident-revalidation-results.example.json'
      - '.github/workflows/release-assurance-visualization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visualization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run visualization tests
        run: python -m pytest tests/unit/test_release_assurance_visualization.py
      - name: Render release assurance timeline
        run: |
          python scripts/render_release_assurance_visualization.py \
            --baseline examples/ai-system-passport.baseline.json \
            --candidate examples/ai-system-passport.candidate.json \
            --incident examples/incident-regression.example.json \
            --revalidation examples/incident-revalidation-results.example.json \
            --trace-id trace-prod-demo-001
      - name: Publish visualization summary
        run: |
          echo '## AI Release Assurance Visualization' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('reports/release-assurance-timeline.json').read_text())
          print(f"- System: `{data['system_id']}`")
          print(f"- Release: `{data['release_id']}`")
          print(f"- Trust status: **{data['trust_status']}**")
          print(f"- Trust score: **{data['trust_score']}/100**")
          print(f"- Timeline stages: **{len(data['timeline'])}**")
          print(f"- Evidence nodes: **{len(data['nodes'])}**")
          print(f"- Evidence relationships: **{len(data['edges'])}**")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-assurance-visualization
          path: |
            reports/release-assurance-timeline.html
            reports/release-assurance-timeline.json
          retention-days: 90
