name: Nightly Authorized AI Performance
on:
  schedule: [{cron: "30 21 * * 2,4"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  load:
    environment: ai-performance-authorized
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AIQ_ALLOW_LIVE_MODEL_CALLS: "true"
      AIQ_PERFORMANCE_AUTHORIZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev,performance]'
      - run: bash scripts/test_performance.sh nightly
      - run: python -m ai_quality.cli gate --profile nightly --scope performance
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: nightly-performance-report, path: reports/, retention-days: 14}
