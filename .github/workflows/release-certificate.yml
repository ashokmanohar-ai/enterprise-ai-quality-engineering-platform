name: AI Release Certificate

on:
  push:
    branches: [main]
    paths:
      - 'src/ai_quality/release_certificate.py'
      - 'src/ai_quality/release_evidence_bundle.py'
      - 'src/ai_quality/passport_engine.py'
      - 'src/ai_quality/passport_diff.py'
      - 'scripts/build_release_certificate.py'
      - 'tests/unit/test_release_certificate.py'
      - 'examples/ai-system-passport*.json'
      - '.github/workflows/release-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run release certificate tests
        run: python -m pytest tests/unit/test_release_certificate.py
      - name: Build AI release certificate
        run: |
          python scripts/build_release_certificate.py \
            --baseline examples/ai-system-passport.baseline.json \
            --candidate examples/ai-system-passport.candidate.json
      - name: Publish certificate summary
        run: cat reports/release-certificate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-release-certificate
          path: |
            reports/release-certificate.json
            reports/release-certificate.md
          retention-days: 90
