name: Nightly Authorized AI Security
on:
  schedule: [{cron: "30 20 * * 1-5"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  red-team:
    environment: ai-security-authorized
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_EVALUATOR_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EVALUATOR_DEPLOYMENT }}
      AIQ_ALLOW_LIVE_MODEL_CALLS: "true"
      AIQ_SECURITY_AUTHORIZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - run: python -m pip install -e '.[dev,security-pyrit,security-garak]'
      - run: npm ci
      - run: bash scripts/test_security.sh nightly security
      - run: python -m ai_quality.cli gate --profile nightly --scope security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-nightly-security-report
          path: reports/
          retention-days: 14
