name: Release Trust Score and Evidence Graph

on:
  push:
    branches: [main]
    paths:
      - 'src/ai_quality/release_trust_graph.py'
      - 'src/ai_quality/incident_regression_loop.py'
      - 'src/ai_quality/incident_revalidation_gate.py'
      - 'src/ai_quality/release_certificate.py'
      - 'src/ai_quality/release_evidence_bundle.py'
      - 'src/ai_quality/trace_release_correlation.py'
      - 'scripts/build_release_trust_graph.py'
      - 'tests/unit/test_release_trust_graph.py'
      - 'examples/*.json'
      - '.github/workflows/release-trust-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run trust graph unit tests
        run: python -m pytest tests/unit/test_release_trust_graph.py
      - name: Build release trust assessment
        run: |
          python scripts/build_release_trust_graph.py \
            --baseline examples/ai-system-passport.baseline.json \
            --candidate examples/ai-system-passport.candidate.json \
            --incident examples/incident-regression.example.json \
            --revalidation examples/incident-revalidation-results.example.json \
            --trace-id trace-prod-demo-001
      - name: Publish trust summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path('reports/release-trust-assessment.json').read_text())
          print('## Release Trust Score & Evidence Graph')
          print()
          print(f"- Trust status: **{result['trust_status']}**")
          print(f"- Trust score: **{result['trust_score']}/100**")
          print(f"- Hard blockers: **{len(result['hard_blockers'])}**")
          print(f"- Evidence nodes: **{len(result['nodes'])}**")
          print(f"- Evidence edges: **{len(result['edges'])}**")
          print(f"- Integrity SHA-256: `{result['integrity_sha256']}`")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-trust-evidence-graph
          path: reports/release-trust-assessment.json
          retention-days: 90
