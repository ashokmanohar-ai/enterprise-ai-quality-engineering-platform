description: Prompt v1 versus v2 regression on canonical AcmeCloud cases
prompts:
  - id: file://../prompts/customer-support/v1.txt
    label: baseline-v1
  - id: file://../prompts/customer-support/v2.txt
    label: candidate-v2
providers:
  - id: azure:chat:{{ env.AZURE_OPENAI_CHAT_DEPLOYMENT }}
    config:
      apiBaseUrl: '{{ env.AZURE_OPENAI_ENDPOINT }}'
      apiKey: '{{ env.AZURE_OPENAI_API_KEY }}'
      apiVersion: '{{ env.AZURE_OPENAI_API_VERSION }}'
      temperature: 0
tests: file://../datasets/generated/promptfoo-golden.json
evaluateOptions: {maxConcurrency: 3, showProgressBar: false}
